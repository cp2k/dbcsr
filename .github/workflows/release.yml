---
name: Create release
on:
  push:
    tags:
    - 'v*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cp2k/dbcsr-build-env-ubuntu-22.04:develop

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Configure git to trust the workspace despite the different owner
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Create Source Archive
      id: source_archive
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        git-archive-all "./dbcsr-${version}.tar.gz"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: true
        prerelease: true

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dbcsr-${{ steps.source_archive.outputs.version }}.tar.gz
        asset_name: dbcsr-${{ steps.source_archive.outputs.version }}.tar.gz
        asset_content_type: application/gzip

